<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Aplicación - Uso de Toast</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="card">
        <h2>Iniciar Sesión</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button class="btn-enviar" onclick="probarLogin()">Ingresar</button>
    </div>

    <!-- 3. Lógica de tu librería Toast -->
    <script src="js/toast.js"></script>

    <script>
        function probarLogin() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            
            // 1. Si falta algún campo
            if (user === "" || pass === "") {
                mostrarToast('Por favor, llena todos los campos', 'advertencia');
            } 
            // 2. Si la contraseña es incorrecta (simulación)
            else if (pass !== "12345") {
                mostrarToast('Contraseña incorrecta, intenta de nuevo', 'error');
            } 
            // 3. Si todo está bien
            else {
                mostrarToast('¡Bienvenido de nuevo, ' + user + '!', 'exito');
            }
        }
    </script>
</body>
</html>
